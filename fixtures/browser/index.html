<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenRouter Companion panel fixture</title>
    <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--snui-color-background);
      color: var(--snui-color-text);
      font-family: var(--snui-font-family);
    }

    main {
      width: min(100%, 56rem);
      margin-inline: auto;
      padding: 1rem;
    }

    h1 {
      margin: 0 0 1rem;
      font-size: 1.4rem;
    }
    </style>
  </head>
  <!-- snui-tokens carries the shared palette into this non-React host page, so
       the mock admin chrome follows the panel theme instead of a fixed color. -->
  <body class="snui-tokens">
    <main>
      <h1>OpenRouter Companion configuration</h1>
      <div id="root"></div>
    </main>
    <div id="fixture-error"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
