name: plugin-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: SignalK/signalk-server/.github/workflows/plugin-ci.yml@faab2be886fa7d52f926e7d2acf91c910623d4d7
    with:
      build-command: npm run build
      test-command: npm run test:run
      format-check-command: npm run format:check
      coverage-command: npm run test:coverage
      node-versions: '["22", "24", "26"]'
      enable-signalk-integration: true
      signalk-server-versions: '["2.25.0", "latest"]'
