name: plugin-ci

# The Signal K plugin registry credits a release only while a run of the
# reusable workflow is among the newest 20 runs on the published commit, and
# scheduled and Dependabot runs keep landing on main HEAD after a release. The
# weekly run, timed after the other Monday schedules, keeps a current one in
# that window. No tag trigger: a release tag points at a commit already on
# main, and that commit's push run covers it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '37 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: SignalK/signalk-server/.github/workflows/plugin-ci.yml@55466a958cf2958542208fed559d70911888f1bb
    # ci.yml already checks formatting and coverage once, and its Signal K Admin
    # job installs the packed tarball into real servers and mounts the panel,
    # so the reusable format, coverage, and integration lanes stay off.
    with:
      build-command: npm run build
      test-command: npm run test:run
      node-versions: '["22", "24", "26"]'
