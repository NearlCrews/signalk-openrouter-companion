name: plugin-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: SignalK/signalk-server/.github/workflows/plugin-ci.yml@ede45a7abfcdfa3b31f369333a12dcf8b450b8ad
    with:
      format-check-command: npm run format:check
      coverage-command: npm run test:coverage
      node-versions: '["22", "24", "26"]'
      enable-armv7: false
      enable-signalk-integration: true
      signalk-server-versions: '["2.25.0", "latest"]'
