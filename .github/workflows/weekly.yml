name: Weekly Checks

# Checks that track the outside world rather than the code: external links and
# advisories in build and test tooling that never ships. They run weekly and on
# demand instead of gating pushes; the runtime audit the plugin registry scores
# gates every push in ci.yml, and verify:release repeats both audits before a
# release. One workflow keeps the weekly run count on main HEAD low, because the
# registry reads only the newest 20 runs on a release commit.
on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      - run: npx --yes npm@11.18.0 ci
      - run: npx --yes npm@11.18.0 run check:links:external

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          package-manager-cache: false
      # npm audit reads the lockfile, so no install is needed.
      - run: npx --yes npm@11.18.0 run audit:release
